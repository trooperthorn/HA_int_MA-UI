# Gates dependency changes. Two steps can fail this workflow and are meant to:
# Dependency Review (GitHub's advisory and licence check) and the runtime
# audit. Everything else is advisory and says so, rather than quietly passing.
#
# Scope model: this is a frontend, so a "runtime" dependency is one whose code
# reaches a browser and a "development" one is build tooling. Runtime
# advisories gate. Development advisories are reported but do not block: a fix
# often is not available on the day, and blocking every PR on build-chain
# noise teaches people to ignore the gate. Both are visible either way.
name: Dependency Security

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "11.8.0"

permissions:
  contents: read
  pull-requests: write

jobs:
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the dependency diff is taken against the base branch

      # Gating. Needs the dependency graph enabled on the repository: it is off
      # by default on forks, and while it was off this step errored out instead
      # of reviewing anything, which left the workflow with no gate at all.
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: always
          deny-licenses: GPL-3.0, AGPL-3.0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Gating. Anything that reaches a browser has to be clean at moderate and
      # above, with no continue-on-error to soften it.
      - name: Audit runtime dependencies
        run: |
          echo "## Runtime dependency audit" >> "$GITHUB_STEP_SUMMARY"
          if pnpm audit --prod --audit-level moderate; then
            echo "No advisories at moderate or above in runtime dependencies." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "**Failed**: a runtime dependency carries an advisory at moderate or above."
              echo ""
              echo "Runtime code ships to the browser, so this blocks the merge. Upgrade the"
              echo "package, add a scoped entry under \`overrides\` in \`pnpm-workspace.yaml\`,"
              echo "or drop the dependency."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Advisory. Build-chain findings do not ship, so they are reported and
      # left to judgement rather than blocking a merge.
      - name: Audit the full tree
        id: full_audit
        continue-on-error: true
        run: |
          set +e
          report=$(pnpm audit --audit-level moderate 2>&1)
          status=$?
          {
            echo "## Full dependency audit (advisory, does not block)"
            echo '```'
            echo "$report" | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # the step is continue-on-error, so this only records the outcome
          # for the Result step to read
          exit $status

      # Advisory. This lists what changed so a human reads it; it is not a
      # malicious-package scanner. The previous name-pattern heuristic was
      # removed rather than kept: it could only catch a typo, never a
      # compromised release of a package already trusted, which is the likelier
      # way this tree gets hurt, and its "no obvious typosquatting detected"
      # line read as an all-clear it had not earned.
      - name: List dependency changes for review
        continue-on-error: true
        run: |
          base="origin/${{ github.base_ref }}"
          added=$(git diff "$base...HEAD" -- package.json \
            | grep -E '^\+ *"' \
            | sed -E 's/.*"(@?[^"]+)".*/\1/' \
            | sort -u || true)
          {
            echo "## Dependency changes"
            if [ -z "$added" ]; then
              echo "No added or changed entries in package.json."
            else
              echo "Check each of these before merging -- publisher, release date, download"
              echo "count, and whether the name is the package you meant:"
              echo ""
              while IFS= read -r pkg; do
                [ -z "$pkg" ] && continue
                echo "- [\`$pkg\`](https://www.npmjs.com/package/$pkg)"
              done <<< "$added"
            fi
            if git diff "$base...HEAD" --name-only | grep -q "package.json" \
              && ! git diff "$base...HEAD" --name-only | grep -q "pnpm-lock.yaml"; then
              echo ""
              echo "**Warning**: package.json changed but pnpm-lock.yaml did not."
              echo "::warning::package.json changed without a lockfile update"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Reports what actually happened. The previous version of this step ran
      # under `if: always()` and printed a success banner unconditionally, so
      # it claimed every check had passed even when one had failed.
      - name: Outcome
        if: always()
        run: |
          {
            echo "---"
            echo "## Result"
            if [ "${{ job.status }}" = "success" ]; then
              echo "Gating checks passed: no high-severity advisory or denied licence in the"
              echo "dependency diff, and no runtime advisory at moderate or above."
            else
              echo "**A gating check failed.** See the annotated step above."
            fi
            if [ "${{ steps.full_audit.outcome }}" = "failure" ]; then
              echo ""
              echo "The advisory full-tree audit also reported findings. Those do not block"
              echo "the merge, but they are build-chain debt worth clearing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
