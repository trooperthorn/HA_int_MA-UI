# Publishes this fork's frontend as a Python wheel on a GitHub release.
#
# The upstream release.yml cannot run here: it needs the musicassistant-bot
# GitHub App, a PyPI token and write access to the server repository. This
# workflow produces the one artifact the fork needs downstream: the
# music-assistant-frontend wheel that trooperthorn/ha_app_music_assistant
# installs over the upstream package. Versions are CalVer YYYY.MM.DD.N
# (tag vYYYY.MM.DD.N; the wheel carries the PEP 440 form YYYY.M.D.N).
name: Publish fork wheel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.x"
  NODE_OPTIONS: --max_old_space_size=6144

jobs:
  publish:
    name: Build and publish the wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # the commit already released is left alone
          LATEST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 50 --json tagName --jq '[.[] | select(.tagName | test("^v[0-9]{4}[.][0-9]{2}[.][0-9]{2}[.][0-9]+$"))][0].tagName // empty')"
          if [ -n "$LATEST_TAG" ] && [ "$(git rev-list -n 1 "$LATEST_TAG" 2>/dev/null || true)" = "$GITHUB_SHA" ]; then
            echo "Release $LATEST_TAG already covers $GITHUB_SHA; nothing to do."
            printf 'publish=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY="$(TZ=America/Chicago date +%Y.%m.%d)"
          SEQ="$(git tag --list "v${TODAY}.*" | sed -E 's/^v[0-9.]*\.([0-9]+)$/\1/' | sort -n | tail -1)"
          SEQ="${SEQ:-0}"
          VERSION="${TODAY}.$((SEQ + 1))"
          # PEP 440 drops the leading zeros of the month and day
          PEP440="$(printf '%s' "$VERSION" | sed -E 's/\.0+([0-9])/.\1/g')"
          printf 'publish=true\n' >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'pep440=%s\n' "$PEP440" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pnpm
        if: steps.version.outputs.publish == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0

      - name: Set up Node
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: |
          pnpm install --frozen-lockfile
          python3 -m pip install build tomli tomli-w

      - name: Set the package version
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.pep440 }}
        shell: python
        run: |-
          import os

          import tomli
          import tomli_w

          with open("pyproject.toml", "rb") as f:
              pyproject = tomli.load(f)
          pyproject["project"]["version"] = os.environ["RELEASE_VERSION"]
          with open("pyproject.toml", "wb") as f:
              tomli_w.dump(pyproject, f)

      - name: Run tests
        if: steps.version.outputs.publish == 'true'
        run: pnpm test:run
        env:
          CI: true

      - name: Build the bundle and the wheel
        if: steps.version.outputs.publish == 'true'
        run: |
          pnpm build
          rm -rf dist music_assistant_frontend.egg-info
          python3 -m build
          .github/scripts/verify-python-package.sh
          (cd dist && sha256sum -- *.whl > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Tag and publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
              --field "ref=refs/tags/$TAG" --field "sha=$GITHUB_SHA" >/dev/null
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes --verify-tag \
            dist/*.whl dist/SHA256SUMS
          {
            echo "### Fork wheel $TAG"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The Home Assistant app repository pins this wheel. Its daily "Sync
      # upstream" workflow would pick the release up the next morning; kicking
      # it now turns a merge here into an app update within the hour. Needs the
      # release GitHub App (ha-soc-release-automation) installed on both repos.
      - name: Check the release-automation credentials
        if: steps.version.outputs.publish == 'true'
        id: automation
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::RELEASE_AUTOMATION_CLIENT_ID / RELEASE_AUTOMATION_PRIVATE_KEY not set; the app repository will pick this wheel up on its daily sync instead."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create a short-lived token for the app repository
        if: steps.automation.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          owner: trooperthorn
          repositories: ha_app_music_assistant
          # Contents write, not Actions write: the release App was created with
          # Contents and Pull requests only, so asking for Actions returns 422
          # "permissions requested are not granted to this installation" and no
          # per-repository install can grant it. POST /repos/.../dispatches is
          # reachable with Contents write, which avoids widening the App across
          # the seventeen repositories it is installed on.
          permission-contents: write

      - name: Start the app repository's upstream sync
        if: steps.automation.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APP_REPO: trooperthorn/ha_app_music_assistant
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$APP_REPO/dispatches" \
            -f event_type=fork-frontend-published \
            -F "client_payload[tag]=$TAG"
          echo "Asked trooperthorn/ha_app_music_assistant to sync for $TAG" >> "$GITHUB_STEP_SUMMARY"
